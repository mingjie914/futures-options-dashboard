</style></head><body><aside><h2>期权终端<span style="color:#6d98d5">.</span></h2><nav><button data-page="oi" class="active">▥　持仓成交</button><button data-page="chain">▦　完整期权链</button></nav><small>研究页 · 本地预览<br>DESIGN STUDY / 02</small></aside><main><header><div><input class="brandselect" list="products" id="product" value="IM · 中证1000" aria-label="搜索品种"><datalist id="products"><option value="IM · 中证1000"><option value="IF · 沪深300"><option value="IH · 上证50"><option value="AU · 黄金"></datalist><span class="muted" style="margin-left:13px" id="mapping">期权 MO</span></div><span class="topmeta">示例截面 2026-09-09　/　非实时行情</span></header><div class="quote" id="quote"><span>中证1000<strong>7,648.8</strong></span><span class="muted">IM2609 <b style="color:#41536e">7,618.6</b></span><span class="muted">IM2610 <b style="color:#41536e">7,544.8</b></span><span style="margin-left:auto;font-size:11px" class="muted">剩余时间按示例日计算 · 自然日</span></div><div class="months" id="months"></div><div id="content"></div><footer class="foot"><span>布局与交互示例 · 未接入 Wind · 不用于交易</span><span>红涨绿跌 · 执行价由高到低</span></footer></main><dialog id="compare"><div class="heading"><h1>比较篮</h1><button class="plain" onclick="document.getElementById('compare').close()">关闭</button></div><p class="muted">已选合约供布局确认；目标损益、最大亏损将在接入报价后计算。</p><div id="comparebody"></div></dialog><script>
const months=[['2609','2026-09-18',9,'#3274d2'],['2610','2026-10-16',37,'#8b5dc5'],['2611','2026-11-20',72,'#38878c'],['2612','2026-12-18',100,'#af8033'],['2703','2027-03-19',191,'#6f7ec0'],['2706','2027-06-18',282,'#a66587']];
const strikes=[8200,8100,8000,7900,7800,7700,7600,7500,7400,7300,7200,7100,7000],calls=[2840,3520,24539,6370,13438,10080,8760,5140,3490,2320,1640,1020,870],puts=[310,430,760,1280,1890,2960,4130,6230,7490,9100,8700,9860,12869];
let page=location.hash==='#chain'?'chain':'oi',month=0,metric='持仓量 + 增减',mode='按月 T型链',basket=['MO2609-C-7700','MO2610-C-7700'];const $=s=>document.querySelector(s);const code=i=>'MO'+months[i][0].slice(0,2)+'<span style="color:'+months[i][3]+'">'+months[i][0].slice(2)+'</span>';const num=n=>n.toLocaleString('en-US');
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#months').innerHTML=months.map((m,i)=>`<button class="month ${i===month?'selected':''}" data-month="${i}"><strong>${code(i)}</strong><small>${m[1]} 到期</small><em>剩余 ${m[2]} 自然日</em></button>`).join('');$('#months').querySelectorAll('button').forEach(b=>b.onclick=()=>{month=+b.dataset.month;render()});const valid=$('#product').value.startsWith('IM');$('#quote').classList.toggle('hidden',!valid);$('#months').classList.toggle('hidden',!valid);if(!valid){$('#content').innerHTML='<div class="empty"><h1>该品种尚未填充示例</h1><p>切回 IM 查看两页完整布局；正式版将按品种加载对应合约与计算口径。</p></div>';return}page==='oi'?renderOI():renderChain()}
function holdingSegments(current,change){return {base:current-Math.max(change,0),added:Math.max(change,0),removed:Math.max(-change,0),extent:current+Math.max(-change,0)}}
function renderOI(){const factor=1-month*.115;const bar=(n,i,put)=>{
const current=Math.round(n*factor), fixed={8000:320,7800:-216,7700:848};
const change=!put&&fixed[strikes[i]]!==undefined?Math.round(fixed[strikes[i]]*factor):(i%4===0?-1:1)*Math.round(current*.10);
const volume=Math.round(current*.42+(i%3)*217),parts=holdingSegments(current,change), isVolume=metric==='成交量',scale=isVolume?11000:27000;
const segment=(v,kind)=>v?`<span class="oi-segment ${kind}" style="width:${v/scale*100}%"></span>`:'';
const body=isVolume?segment(volume,'oi-base'):segment(parts.base,'oi-base')+segment(parts.added,'oi-added')+segment(parts.removed,'oi-removed');
const label=`<span class="oi-value">${num(isVolume?volume:current)}${isVolume?'':`<small class="${change<0?'down':'up'}">${change>0?'+':''}${num(change)}</small>`}</span>`;
const title=isVolume?`成交量 ${num(volume)} 手`:`当前持仓 ${num(current)} 手；当日变化 ${change>0?'+':''}${num(change)} 手；前值 ${num(current-change)} 手`;
const track=`<span class="oi-track ${put?'':'call-track'}" role="img" aria-label="${title}" title="${title}">${body}</span>`;
return put?track+label:label+track};$('#content').innerHTML=`<div class="heading"><div><h1>持仓分布与增减</h1><p class="muted" style="font-size:12px;margin:8px 0 0">${code(month)} · 观察集中区与持仓迁移</p></div><div class="seg">${['持仓量 + 增减','成交量'].map(m=>`<button class="${metric===m?'on':''}" data-metric="${m}">${m}</button>`).join('')}</div></div><div class="oi-layout"><section class="surface"><div class="heading"><h3 style="margin:0">执行价分布 <span class="muted" style="font-size:11px;font-weight:400">单位：手</span></h3><div class="legend"><span><i class="dot" style="background:#7796d4"></i>存量</span><span><i class="dot" style="background:#ce414a"></i>增仓</span><span><i class="dot" style="border:1px dashed #16866d"></i>减仓</span></div></div><p class="oi-explain">${metric==='成交量'?'成交量单独显示 · 单位：手':'实心总长 = 当前持仓；红段包含在内，绿色虚线段为已减少的持仓。变化基准：前一交易日。'}</p><div class="chart-head"><span>看涨期权 Call</span><span>执行价</span><span>看跌期权 Put</span></div>${strikes.map((s,i)=>`<div class="barrow ${s===7700||s===7600?'atm':''}"><div class="barcell left">${bar(calls[i],i,false)}</div><div class="strike">${s}</div><div class="barcell">${bar(puts[i],i,true)}</div></div>`).join('')}<div class="spotline">── 现货 7,648.8 · 平值区间 7600—7700 ──</div></section><section class="surface"><h3>重点执行价 <span class="muted" style="font-size:11px">Call</span></h3>${[[8000,24539,320],[7800,13438,-216],[7700,10080,848]].map(([k,o,d])=>`<div class="keyrow"><strong>${k}</strong><p><span class="muted">持仓量</span><span>${num(Math.round(o*factor))}</span></p><p><span class="muted">当日增减</span><span class="${d>0?'up':'down'}">${d>0?'+':''}${num(Math.round(d*factor))}</span></p><p><span class="muted">距现货</span><span>${(k/7648.8*100-100).toFixed(2)}%</span></p></div>`).join('')}<p class="note">持仓集中 ≠ 卖方阻力<br>结合增减仓、价格路径与实际盘口判断。</p></section></div><div class="bottom"><section class="surface"><h3>全月份持仓占比</h3><div class="share">${[32,25,16,13,8,6].map((v,i)=>`<div style="width:${v}%;background:${months[i][3]}" title="MO${months[i][0]} ${v}%"></div>`).join('')}</div><div class="shares">${[32,25,16,13,8,6].map((v,i)=>`<span>${code(i)}<br><br>${v}%</span>`).join('')}</div></section><section class="surface"><div class="heading" style="margin-bottom:4px"><h3>7700 Call · 持仓变化轨迹</h3><span class="muted" style="font-size:11px">示意 · 手</span></div><svg class="trend" viewBox="0 0 600 120" role="img" aria-label="持仓由7500手升至10080手的示例趋势"><path d="M40 20H570M40 55H570M40 90H570" stroke="#edf0f5"/><text x="0" y="24" fill="#8995a5" font-size="10">10,000</text><text x="0" y="94" fill="#8995a5" font-size="10">7,500</text><path d="M45 87L145 76L245 82L350 49L455 40L565 18" fill="none" stroke="#6989c8" stroke-width="2.5"/><circle cx="565" cy="18" r="4" fill="#6989c8"/><text x="44" y="115" fill="#8995a5" font-size="10">09/02</text><text x="290" y="115" fill="#8995a5" font-size="10">09/07</text><text x="540" y="115" fill="#8995a5" font-size="10">09/09</text></svg></section></div>`;document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;renderOI()})}
function renderChain(){ $('#content').innerHTML=`<div class="heading"><h1>完整期权链</h1><div class="seg">${['按月 T型链','跨月对比'].map(m=>`<button data-mode="${m}" class="${mode===m?'on':''}">${m}</button>`).join('')}</div></div><div class="tools"><input type="search" id="search" placeholder="搜索执行价，如 7700" aria-label="搜索执行价"><label class="muted" style="font-size:12px"><input type="checkbox" id="atm"> 仅平值附近</label><span style="margin-left:auto;font-size:12px" class="muted">报价：点　持仓：手　IV：%</span></div><div class="chainwrap"><div class="contracthead"><strong>${mode==='按月 T型链'?code(month):'全部月份 · 相同执行价对比'}</strong><span class="muted">${mode==='按月 T型链'?months[month][1]+' 到期 · 剩余 '+months[month][2]+' 自然日':'展示 Call 买卖报价'}</span></div><div id="table"></div></div><div id="groups"></div><div class="basket"><strong>比较篮 <span id="count"></span></strong><div class="chips" id="chips"></div><button class="primary" id="review">查看比较</button></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderChain()});$('#search').oninput=drawTable;$('#atm').onchange=drawTable;$('#groups').innerHTML=mode==='按月 T型链'?months.map((m,i)=>i===month?'':`<button class="collapse" data-open="${i}"><span>＋　${code(i)}</span><span>${m[1]} 到期　·　剩余 ${m[2]} 自然日</span></button>`).join(''):'';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{month=+b.dataset.open;render()});$('#review').onclick=()=>{$('#comparebody').textContent=basket.length?basket.join('　 /　 '):'尚未选择合约';$('#compare').showModal()};drawTable();drawBasket()}
function drawTable(){const rows=strikes.filter(k=>(!$('#search').value||String(k).includes($('#search').value))&&(!$('#atm').checked||Math.abs(k-7650)<=150));if(mode==='跨月对比'){$('#table').innerHTML='<table><thead><tr><th class="k">执行价</th>'+months.map((m,i)=>'<th>'+code(i)+'<br><small>买价 / 卖价</small></th>').join('')+'</tr></thead><tbody>'+rows.map(k=>'<tr><td class="k">'+k+'</td>'+months.map((m,i)=>{const p=price(k,i);return '<td>'+p.toFixed(1)+' / '+(p+1.2+i*.4).toFixed(1)+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>';return}const fields=['持仓','Delta','IV','涨跌','买价','卖价'];$('#table').innerHTML='<table><thead><tr class="callput"><th colspan="7">CALL · 看涨期权</th><th class="k">执行价</th><th colspan="7">PUT · 看跌期权</th></tr><tr><th></th>'+fields.map(t=>'<th>'+t+'</th>').join('')+'<th class="k">高 → 低</th>'+[...fields].reverse().map(t=>'<th>'+t+'</th>').join('')+'<th></th></tr></thead><tbody>'+rows.map(k=>{let i=strikes.indexOf(k),c=price(k,month),p=Math.max(3,c+k-7618.6),delta=Math.min(.97,Math.max(.03,.42+(7700-k)*.0011)),d=i%3===0?-2.4:3.6;return `<tr class="${k===7600||k===7700?'near':''}"><td><button class="add" data-add="MO${months[month][0]}-C-${k}" aria-label="添加Call ${k}">+</button></td><td>${num(Math.round(calls[i]*(1-month*.1)))}</td><td>${delta.toFixed(2)}</td><td>${(27.8+(k-7700)**2/200000).toFixed(1)}</td><td class="${d>0?'up':'down'}">${d>0?'+':''}${d.toFixed(1)}</td><td>${c.toFixed(1)}</td><td>${(c+1.2).toFixed(1)}</td><td class="k">${k}</td><td>${(p+1.2).toFixed(1)}</td><td>${p.toFixed(1)}</td><td class="${d>0?'down':'up'}">${d>0?'':'+'}${(-d).toFixed(1)}</td><td>28.6</td><td>${(delta-1).toFixed(2)}</td><td>${num(Math.round(puts[i]*(1-month*.1)))}</td><td><button class="add" data-add="MO${months[month][0]}-P-${k}" aria-label="添加Put ${k}">+</button></td></tr>`}).join('')+'</tbody></table>';if(!rows.length)$('#table').innerHTML='<div class="empty">没有匹配的执行价</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!basket.includes(b.dataset.add))basket.push(b.dataset.add);drawBasket()})}
function price(k,m){return Math.max(1.4,95.8*Math.exp((7700-k)/245))+m*22}
function drawBasket(){$('#count').textContent='· '+basket.length;$('#chips').innerHTML=basket.map((v,i)=>`<button class="chip" data-remove="${i}" title="移出比较篮">${v} ×</button>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{basket.splice(+b.dataset.remove,1);drawBasket()})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;location.hash=page;render()});$('#product').onchange=()=>{const p=$('#product').value.slice(0,2);$('#mapping').textContent='期权 '+({IM:'MO',IF:'IO',IH:'HO',AU:'AU'}[p]||'—');render()};render();
</script></body></html>
