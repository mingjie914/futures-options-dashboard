[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seat-dashboard-backend"
version = "0.1.0"
description = "Portable futures seat dashboard API and offline snapshot builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1,<2"]
test = [
  "pyarrow>=16,<22",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[project.scripts]
seat-dashboard-api = "seat_dashboard.main:run"
seat-dashboard-snapshot = "seat_dashboard.jobs.build_snapshot:main"
seat-dashboard-demo = "seat_dashboard.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seat_dashboard = ["adapters/store/duckdb/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
